version: "3"

# Streams live logs from the deployed Worker. `wrangler tail` only shows invocations that
# happen while it is attached, and tail sessions expire after a few hours or drop silently,
# so scripts/tail.sh reconnects in a loop until interrupted with Ctrl-C. Leave one running
# to catch the 03:00 UTC run. Secrets are resolved from the op:// references in .env by 1Password.
#
# The loop lives in a real bash script because task's built-in shell interpreter does not
# support `trap`.

tasks:
  test:
    desc: Run the Vitest suite inside workerd (extra args go to vitest, e.g. task test -- test/select.test.ts)
    cmds:
      - bunx vitest run {{.CLI_ARGS}}

  typecheck:
    desc: Typecheck with tsc
    cmds:
      - bunx tsc --noEmit

  lint:
    desc: Check formatting, lint rules and import order with Biome
    cmds:
      - bunx biome check .

  lint:fix:
    desc: Apply Biome fixes
    cmds:
      - bunx biome check --write .

  check:
    desc: Run lint, typecheck and tests (what CI runs before deploying)
    cmds:
      - task: lint
      - task: typecheck
      - task: test

  dev:
    desc: Run the Worker locally (trigger with GET /cdn-cgi/handler/scheduled; never against the real account)
    cmds:
      - bunx wrangler dev --test-scheduled

  deploy:
    desc: Deploy the Worker with wrangler
    cmds:
      - bunx wrangler deploy

  count:
    desc: Count likes and reposts older than one year via the public listRecords endpoint, read-only (e.g. task count -- --at 2026-11-10T03:00:00Z app.bsky.feed.repost)
    cmds:
      - bun scripts/count-old.ts {{.CLI_ARGS}}

  logs:
    desc: Stream the deployed Worker's logs (pretty), reconnecting when the session ends
    cmds:
      - bash scripts/tail.sh --format pretty

  logs:json:
    desc: Stream the deployed Worker's logs as JSON lines (for agents and jq), reconnecting
    cmds:
      - bash scripts/tail.sh --format json

  logs:errors:
    desc: Stream only failed invocations (pretty), reconnecting
    cmds:
      - bash scripts/tail.sh --format pretty --status error
