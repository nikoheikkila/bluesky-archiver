version: "3"

vars:
  OP: op run --env-file=.env --

tasks:
  install:
    desc: Install packages with Bun
    sources:
      - package.json
      - bun.lock
    run: once
    cmd: bun install --frozen-lockfile

  test:
    desc: Run the Vitest suite inside workerd (extra args go to vitest, e.g. task test -- test/select.test.ts)
    cmds:
      - bunx vitest run {{.CLI_ARGS}}

  mutation:
    desc: Full-project mutation run with Stryker (slow; use at the end-of-phase gate)
    cmds:
      - bunx stryker run {{.CLI_ARGS}}

  mutation:incremental:
    desc: Mutation run reusing cached results (--incremental)
    cmds:
      - bunx stryker run --incremental {{.CLI_ARGS}}

  mutation:diff:
    desc: Mutate only production files changed against the base branch (clean tree required)
    cmds:
      - bun scripts/stryker-diff.ts {{.CLI_ARGS}}

  typecheck:
    desc: Generate the Worker's types from wrangler.jsonc into src/cloudflare.d.ts, then typecheck with tsc
    cmds:
      - bunx wrangler types src/cloudflare.d.ts
      - bunx tsc --noEmit

  lint:
    desc: Check formatting, lint rules and import order with Biome
    cmds:
      - task: lint:renovate
      - bunx biome check .

  lint:renovate:
    desc: Lint Renovate configuration
    sources:
      - renovate.json5
    # No file argument: with one, the validator checks the file as a global (self-hosted) config instead of a repo config.
    cmd: bunx --package renovate renovate-config-validator --strict

  format:
    desc: Apply Biome fixes
    cmds:
      - bunx biome check --write .

  check:
    desc: Run lint, typecheck and tests (what CI runs before deploying)
    cmds:
      - task: lint
      - task: typecheck
      - task: test
      - task: mutation:incremental

  op:
    internal: true
    requires:
      vars: [command]
    cmd: op run --env-file=.env -- {{ .command }}

  secret:
    desc: Set the Worker's BLUESKY_APP_PASSWORD secret from 1Password (piped, never in the environment)
    cmd: >-
      op run --env-file=.env --
      sh -c 'op read -n "op://Personal/Bluesky Cleaner/bluesky-app-password"
      | bunx wrangler secret put BLUESKY_APP_PASSWORD'

  deploy:
    desc: Deploy the Worker with wrangler
    cmds:
      - task: op
        vars:
          command: bunx wrangler deploy

  dry-run:
    desc: Test worker deployment in a dry-run mode on a temporary directory
    cmd: bunx wrangler deploy --dry-run --outdir {{ .dir }}
    vars:
      dir:
        sh: mktemp -d

  logs:
    desc: Stream the deployed Worker's logs (pretty), reconnecting when the session ends
    cmds:
      - bash scripts/tail.sh --format pretty

  logs:json:
    desc: Stream the deployed Worker's logs as JSON lines (for agents and jq), reconnecting
    cmds:
      - bash scripts/tail.sh --format json

  logs:errors:
    desc: Stream only failed invocations (pretty), reconnecting
    cmds:
      - bash scripts/tail.sh --format pretty --status error
